name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon :library:assembleRelease :sample:assembleRelease :library:publishToMavenLocal
      - run: |
          mkdir -p dist
          cp sample/build/outputs/apk/release/*.apk dist/air-sample.apk
          cp library/build/outputs/aar/*release*.aar dist/air.aar
      - uses: actions/upload-artifact@v4
        with:
          name: air
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
